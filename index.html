<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handlaid Goods — Coming Soon</title>
<meta name="description" content="Traditional flash, pressed by hand in Sherwood Park, Alberta. Handlaid Goods opens soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16110F;
    --paper:#EDE0C8;
    --red:#B83A2B;
    --gold:#D99B2B;
    --display:"Alfa Slab One",Georgia,serif;
    --body:"Archivo","Helvetica Neue",Arial,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--body);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    overflow-x:hidden;
  }

  .wrap{max-width:460px;width:100%;text-align:center}

  .mark{width:88px;height:88px;margin:0 auto 26px;display:block}

  .est{
    font-size:11.5px;letter-spacing:.26em;color:var(--gold);
    margin:0 0 18px;font-weight:600;
  }

  h1{
    font-family:var(--display);
    font-size:clamp(38px,10vw,64px);
    line-height:.98;
    margin:0 0 20px;
  }

  .ribbon{
    display:inline-block;position:relative;
    background:var(--red);color:var(--paper);
    font-family:var(--display);
    font-size:clamp(14px,3.4vw,18px);
    padding:8px 26px;
    margin-bottom:26px;
    box-shadow:0 0 0 3px var(--ink), 0 0 0 6px var(--red);
  }
  .ribbon::before,.ribbon::after{
    content:"";position:absolute;top:5px;width:16px;height:calc(100% - 10px);
    background:var(--red);
  }
  .ribbon::before{left:-21px;clip-path:polygon(0 0,100% 18%,100% 82%,0 100%,26% 50%);}
  .ribbon::after{right:-21px;clip-path:polygon(100% 0,0 18%,0 82%,100% 100%,74% 50%);}

  p.lede{
    font-size:16px;line-height:1.65;color:#D8C9AE;
    margin:0 auto;
    max-width:36ch;
  }

  .foot{
    margin-top:46px;
    font-size:12.5px;color:#9C8B79;
    display:flex;flex-direction:column;gap:6px;align-items:center;
  }

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">

  <svg class="mark" viewBox="0 0 200 200" aria-hidden="true">
    <circle cx="100" cy="100" r="95" fill="none" stroke="#EDE0C8" stroke-width="4"/>
    <circle cx="100" cy="100" r="85" fill="none" stroke="#EDE0C8" stroke-width="1.6"/>
    <g fill="none" stroke="#EDE0C8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M74 62 L74 150"/>
      <path d="M126 62 L126 150"/>
      <path d="M64 82 C64 82 74 92 100 92 C126 92 136 82 136 82"/>
      <path d="M64 118 C64 118 74 128 100 128 C126 128 136 118 136 118"/>
    </g>
    <circle cx="74" cy="62" r="8" fill="none" stroke="#EDE0C8" stroke-width="5"/>
    <circle cx="126" cy="62" r="8" fill="none" stroke="#EDE0C8" stroke-width="5"/>
    <path d="M74 150 L64 168 L74 162 L84 168 Z" fill="#D99B2B" stroke="#EDE0C8" stroke-width="3" stroke-linejoin="round"/>
    <path d="M126 150 L116 168 L126 162 L136 168 Z" fill="#D99B2B" stroke="#EDE0C8" stroke-width="3" stroke-linejoin="round"/>
  </svg>

  <p class="est">Sherwood Park, Alberta</p>
  <h1>Handlaid Goods</h1>
  <div class="ribbon">Bold will hold</div>

  <p class="lede">Traditional flash, pressed by hand — one shirt at a time. The sheet is being drawn.</p>

  <div class="foot">
    <span>hello@handlaidgoods.com</span>
    <span>&copy; Handlaid Goods</span>
  </div>

</div>

</body>
</html>
